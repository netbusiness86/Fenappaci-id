openapi: 3.1.0
info:
  title: Api
  version: 0.3.0
  description: API FENAPPACI — Identification des Producteurs Agricoles de Côte d'Ivoire
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: producteurs
  - name: cooperatives
  - name: stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"

  /producteurs:
    get:
      operationId: listProducteurs
      tags: [producteurs]
      summary: List producteurs
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: region
          in: query
          schema:
            type: string
        - name: cooperative_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: agent_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of producteurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Producteur"
    post:
      operationId: createProducteur
      tags: [producteurs]
      summary: Create a producteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducteurInput"
      responses:
        "201":
          description: Producteur created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producteur"
        "400":
          description: Validation error

  /producteurs/{id}:
    get:
      operationId: getProducteur
      tags: [producteurs]
      summary: Get a producteur by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Producteur details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producteur"
        "404":
          description: Not found
    patch:
      operationId: updateProducteur
      tags: [producteurs]
      summary: Update a producteur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProducteurUpdate"
      responses:
        "200":
          description: Updated producteur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Producteur"
        "404":
          description: Not found
    delete:
      operationId: deleteProducteur
      tags: [producteurs]
      summary: Delete a producteur
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /cooperatives:
    get:
      operationId: listCooperatives
      tags: [cooperatives]
      summary: List cooperatives
      responses:
        "200":
          description: List of cooperatives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CooperativeListItem"
    post:
      operationId: createCooperative
      tags: [cooperatives]
      summary: Create cooperative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CooperativeInput"
      responses:
        "201":
          description: Created cooperative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CooperativeDetail"

  /cooperatives/{id}:
    get:
      operationId: getCooperative
      tags: [cooperatives]
      summary: Get cooperative by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cooperative detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CooperativeDetail"
    patch:
      operationId: updateCooperative
      tags: [cooperatives]
      summary: Update cooperative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CooperativeUpdate"
      responses:
        "200":
          description: Updated cooperative
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CooperativeDetail"
    delete:
      operationId: deleteCooperative
      tags: [cooperatives]
      summary: Delete cooperative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /cooperatives/{id}/membres:
    get:
      operationId: getCooperativeMembres
      tags: [cooperatives]
      summary: Get cooperative membres
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of membres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CooperativeMembre"

  /cooperatives/{id}/membres/{producteurId}:
    put:
      operationId: addCooperativeMembre
      tags: [cooperatives]
      summary: Add membre to cooperative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: producteurId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
    delete:
      operationId: removeCooperativeMembre
      tags: [cooperatives]
      summary: Remove membre from cooperative
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: producteurId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean

  /cooperatives/{id}/stats:
    get:
      operationId: getCooperativeStats
      tags: [cooperatives]
      summary: Get cooperative stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cooperative statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CooperativeStats"

  /stats/dashboard:
    get:
      operationId: getDashboardStats
      tags: [stats]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    LogoutResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    AuthUser:
      type: object
      required: [id, nom, prenoms, email, role]
      properties:
        id:
          type: number
        nom:
          type: string
        prenoms:
          type: string
        email:
          type: string
        role:
          type: string
        region:
          type: ["string", "null"]
        departement:
          type: ["string", "null"]
        sous_prefecture:
          type: ["string", "null"]
        avatar_path:
          type: ["string", "null"]
        created_at:
          type: string

    Producteur:
      type: object
      required: [id, numero_membre, nom, prenoms, status, created_at]
      properties:
        id:
          type: number
        numero_membre:
          type: string
        # Identité
        nom:
          type: string
        prenoms:
          type: string
        sexe:
          type: ["string", "null"]
        date_naissance:
          type: ["string", "null"]
        lieu_naissance:
          type: ["string", "null"]
        nationalite:
          type: ["string", "null"]
        situation_matrimoniale:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        telephone_secondaire:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        # Pièce d'identité
        cin:
          type: ["string", "null"]
        type_piece:
          type: ["string", "null"]
        numero_piece:
          type: ["string", "null"]
        date_delivrance:
          type: ["string", "null"]
        date_expiration:
          type: ["string", "null"]
        # Localisation
        district:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        departement:
          type: ["string", "null"]
        sous_prefecture:
          type: ["string", "null"]
        commune:
          type: ["string", "null"]
        village:
          type: ["string", "null"]
        # Coopérative
        cooperative_id:
          type: ["number", "null"]
        cooperative_nom:
          type: ["string", "null"]
        membre_cooperative:
          type: ["boolean", "null"]
        cooperative_nom_libre:
          type: ["string", "null"]
        cooperative_numero_libre:
          type: ["string", "null"]
        cooperative_fonction:
          type: ["string", "null"]
        # Pièce d'identité — scans
        piece_recto:
          type: ["string", "null"]
        piece_verso:
          type: ["string", "null"]
        # GPS
        latitude:
          type: ["number", "null"]
        longitude:
          type: ["number", "null"]
        gps_precision:
          type: ["number", "null"]
        gps_captured_at:
          type: ["string", "null"]
        # Meta
        cultures:
          type: ["string", "null"]
        superficie_ha:
          type: ["number", "null"]
        photo_path:
          type: ["string", "null"]
        status:
          type: string
        agent_id:
          type: ["number", "null"]
        agent_nom:
          type: ["string", "null"]
        created_at:
          type: string
        # Disponibilités
        has_disponibilites:
          type: boolean

    ProducteurInput:
      type: object
      required: [nom, prenoms]
      properties:
        # Agent assignment (Direction / Admin only — ignored for regular agents)
        agent_id:
          type: ["number", "null"]
        # Identité
        nom:
          type: string
        prenoms:
          type: string
        sexe:
          type: string
        date_naissance:
          type: string
        lieu_naissance:
          type: string
        nationalite:
          type: string
        situation_matrimoniale:
          type: string
        telephone:
          type: string
        telephone_secondaire:
          type: string
        adresse:
          type: string
        # Pièce d'identité
        type_piece:
          type: string
        numero_piece:
          type: string
        date_delivrance:
          type: string
        date_expiration:
          type: string
        # Localisation
        district:
          type: string
        region:
          type: string
        departement:
          type: string
        sous_prefecture:
          type: string
        commune:
          type: string
        village:
          type: string
        # Coopérative
        membre_cooperative:
          type: boolean
        cooperative_nom_libre:
          type: string
        cooperative_numero_libre:
          type: string
        cooperative_fonction:
          type: string
        # Pièce d'identité — scans
        piece_recto:
          type: string
        piece_verso:
          type: string
        # GPS
        latitude:
          type: number
        longitude:
          type: number
        gps_precision:
          type: number
        gps_captured_at:
          type: string
        # Meta
        cooperative_id:
          type: number
        cultures:
          type: string
        superficie_ha:
          type: number
        photo_path:
          type: string

    ProducteurUpdate:
      type: object
      properties:
        # Agent assignment (Direction / Admin only — ignored for regular agents)
        agent_id:
          type: ["number", "null"]
        nom:
          type: string
        prenoms:
          type: string
        sexe:
          type: string
        date_naissance:
          type: string
        lieu_naissance:
          type: string
        nationalite:
          type: string
        situation_matrimoniale:
          type: string
        telephone:
          type: string
        telephone_secondaire:
          type: string
        adresse:
          type: string
        type_piece:
          type: string
        numero_piece:
          type: string
        date_delivrance:
          type: string
        date_expiration:
          type: string
        district:
          type: string
        region:
          type: string
        departement:
          type: string
        sous_prefecture:
          type: string
        commune:
          type: string
        village:
          type: string
        membre_cooperative:
          type: boolean
        cooperative_nom_libre:
          type: string
        cooperative_numero_libre:
          type: string
        cooperative_fonction:
          type: string
        cooperative_id:
          type: number
        cultures:
          type: string
        superficie_ha:
          type: number
        photo_path:
          type: string
        # Pièce d'identité — scans
        piece_recto:
          type: string
        piece_verso:
          type: string
        # GPS
        latitude:
          type: number
        longitude:
          type: number
        gps_precision:
          type: number
        gps_captured_at:
          type: string
        status:
          type: string

    Cooperative:
      type: object
      required: [id, nom, created_at]
      properties:
        id:
          type: number
        nom:
          type: string
        region:
          type: ["string", "null"]
        departement:
          type: ["string", "null"]
        nombre_membres:
          type: ["number", "null"]
        created_at:
          type: string

    CooperativeListItem:
      type: object
      required: [id, nom, created_at]
      properties:
        id:
          type: number
        nom:
          type: string
        region:
          type: ["string", "null"]
        departement:
          type: ["string", "null"]
        nombre_membres:
          type: ["number", "null"]
        created_at:
          type: string

    CooperativeInput:
      type: object
      required: [nom]
      properties:
        nom:
          type: string
        sigle:
          type: string
        numero_identification:
          type: string
        date_creation:
          type: string
        telephone:
          type: string
        email:
          type: string
        adresse:
          type: string
        region:
          type: string
        departement:
          type: string
        sous_prefecture:
          type: string
        village:
          type: string
        president:
          type: string
        vice_president:
          type: string
        secretaire:
          type: string
        tresorier:
          type: string

    CooperativeUpdate:
      type: object
      properties:
        nom:
          type: string
        sigle:
          type: string
        numero_identification:
          type: string
        date_creation:
          type: string
        telephone:
          type: string
        email:
          type: string
        adresse:
          type: string
        region:
          type: string
        departement:
          type: string
        sous_prefecture:
          type: string
        village:
          type: string
        president:
          type: string
        vice_president:
          type: string
        secretaire:
          type: string
        tresorier:
          type: string

    CooperativeDetail:
      type: object
      required: [id, nom, nombre_membres, created_at, updated_at]
      properties:
        id:
          type: number
        nom:
          type: string
        sigle:
          type: ["string", "null"]
        numero_identification:
          type: ["string", "null"]
        date_creation:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        adresse:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        departement:
          type: ["string", "null"]
        sous_prefecture:
          type: ["string", "null"]
        village:
          type: ["string", "null"]
        president:
          type: ["string", "null"]
        vice_president:
          type: ["string", "null"]
        secretaire:
          type: ["string", "null"]
        tresorier:
          type: ["string", "null"]
        nombre_membres:
          type: number
        created_at:
          type: string
        updated_at:
          type: string

    CooperativeMembre:
      type: object
      required: [id, numero_membre, nom, prenoms, status]
      properties:
        id:
          type: number
        numero_membre:
          type: string
        nom:
          type: string
        prenoms:
          type: string
        sexe:
          type: ["string", "null"]
        telephone:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        village:
          type: ["string", "null"]
        status:
          type: string
        cooperative_fonction:
          type: ["string", "null"]

    CooperativeStats:
      type: object
      required: [nombre_producteurs, nombre_hommes, nombre_femmes, nombre_exploitations, nombre_parcelles, superficie_totale, production_totale, production_disponible, par_culture]
      properties:
        nombre_producteurs:
          type: number
        nombre_hommes:
          type: number
        nombre_femmes:
          type: number
        nombre_exploitations:
          type: number
        nombre_parcelles:
          type: number
        superficie_totale:
          type: number
        production_totale:
          type: number
        production_disponible:
          type: number
        par_culture:
          type: array
          items:
            type: object
            required: [culture, count, superficie, production]
            properties:
              culture:
                type: string
              count:
                type: number
              superficie:
                type: number
              production:
                type: number

    DashboardStats:
      type: object
      required: [total_producteurs, producteurs_actifs, producteurs_cette_semaine, cooperatives, par_region, par_culture, par_sexe]
      properties:
        total_producteurs:
          type: number
        producteurs_actifs:
          type: number
        producteurs_cette_semaine:
          type: number
        cooperatives:
          type: number
        par_region:
          type: array
          items:
            $ref: "#/components/schemas/CountGroup"
        par_culture:
          type: array
          items:
            $ref: "#/components/schemas/CountGroup"
        par_sexe:
          type: array
          items:
            $ref: "#/components/schemas/CountGroup"
        superficie_totale:
          type: ["number", "null"]

    CountGroup:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: number
